<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Instant Checkout</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .checkout-card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: center;
    }
    .merchant-title {
      font-size: 15px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .merchant-subtitle {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 18px;
    }
    .price-tag {
      font-size: 32px;
      font-weight: 800;
      color: #1a73e8;
      margin-bottom: 24px;
    }
    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .pay-btn:active {
      background-color: #333333;
    }
    .alt-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <div class="merchant-title">XTREAM BIRYANI DHABA AND RESTAURANT</div>
    <div class="merchant-subtitle">8305581123-1@okbizaxis</div>
    <div class="price-tag">₹1.00</div>

    <!-- Direct GPay Intent: Android standard package call -->
    <a id="gpayDirect" class="pay-btn" href="#">
      Pay ₹1 via Google Pay
    </a>

    <!-- Universal UPI Chooser -->
    <a id="upiDirect" class="alt-btn" href="#">
      Pay via Other UPI Apps
    </a>
  </div>

  <script>
    // Payment Parameters
    const pa = "8305581123-1@okbizaxis";
    const pn = "XTREAM BIRYANI DHABA AND RESTAURANT";
    const am = "1.00";
    const cu = "INR";
    const mc = "5812";
    const mid = "BCR2DN4T7WYKNJ2Q";
    const tr = "TXN" + Date.now();
    const tn = "Order Payment";

    // Standard UPI Query String
    const upiQuery = `pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&mc=${encodeURIComponent(mc)}&tr=${encodeURIComponent(tr)}&tn=${encodeURIComponent(tn)}&am=${encodeURIComponent(am)}&cu=${encodeURIComponent(cu)}`;

    // 1. Google Pay Direct Android Intent (Deep link jo GPay app seedha kholega)
    const gpayIntentUrl = `intent://pay?${upiQuery}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.paisa.user;end`;

    // 2. Generic UPI Intent (Sabhi apps ke liye)
    const genericUpiUrl = `upi://pay?${upiQuery}`;

    // Elements par link bind karein
    document.getElementById("gpayDirect").setAttribute("href", gpayIntentUrl);
    document.getElementById("upiDirect").setAttribute("href", genericUpiUrl);
  </script>

</body>
</html>
