<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Pay Official Web Checkout</title>
  
  <!-- Official Google Pay JavaScript SDK -->
  <script async src="https://pay.google.com/gp/p/js/pay.js" onload="onGooglePayLoaded()"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .checkout-card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: center;
    }
    .merchant-title {
      font-size: 16px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 4px;
    }
    .merchant-subtitle {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 20px;
    }
    .price-tag {
      font-size: 32px;
      font-weight: 800;
      color: #1a73e8;
      margin-bottom: 24px;
    }
    #gpay-button-container {
      display: flex;
      justify-content: center;
      min-height: 48px;
      margin-bottom: 12px;
    }
    .status-box {
      font-size: 13px;
      color: #3c4043;
      padding: 10px;
      background: #f1f3f4;
      border-radius: 6px;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <div class="merchant-title">XTREAM BIRYANI DHABA AND RESTAURANT</div>
    <div class="merchant-subtitle">8305581123-1@okbizaxis</div>
    <div class="price-tag">₹1.00</div>

    <!-- Official Google Pay Button Container -->
    <div id="gpay-button-container"></div>

    <!-- Payment Response/Status -->
    <div id="status-box" class="status-box"></div>
  </div>

  <script>
    // 1. Google Pay API Base Configuration
    const baseRequest = {
      apiVersion: 2,
      apiVersionMinor: 0
    };

    // 2. India UPI Payment Method Specification
    const tokenizationSpecification = {
      type: 'DIRECT'
    };

    const allowedPaymentMethods = [{
      type: 'UPI',
      parameters: {
        payeeVpa: '8305581123-1@okbizaxis',
        payeeName: 'XTREAM BIRYANI DHABA AND RESTAURANT',
        mcc: '5812',
        transactionReferenceId: 'TXN' + Date.now(),
        transactionUrl: window.location.href
      },
      tokenizationSpecification: tokenizationSpecification
    }];

    // 3. Client Initialization
    // NOTE: Testing ke liye environment 'TEST' rakhein. Live payments ke liye 'PRODUCTION' karein.
    let paymentsClient = null;

    function getGooglePaymentsClient() {
      if (paymentsClient === null) {
        paymentsClient = new google.payments.api.PaymentsClient({
          environment: 'TEST' // Badalkar 'PRODUCTION' karein jab account live ho
        });
      }
      return paymentsClient;
    }

    // 4. Page Load par Google Pay availability check karein
    function onGooglePayLoaded() {
      const paymentsClient = getGooglePaymentsClient();
      paymentsClient.isReadyToPay(Object.assign({}, baseRequest, {
        allowedPaymentMethods: allowedPaymentMethods
      }))
      .then(function(response) {
        if (response.result) {
          addGooglePayButton();
        } else {
          showStatus("Aapka device/browser Google Pay support nahi kar raha hai.");
        }
      })
      .catch(function(err) {
        console.error("isReadyToPay error:", err);
      });
    }

    // 5. Official Button Render karna
    function addGooglePayButton() {
      const paymentsClient = getGooglePaymentsClient();
      const button = paymentsClient.createButton({
        buttonColor: 'black',
        buttonType: 'pay',
        buttonSizeMode: 'fill',
        onClick: onGooglePaymentButtonClicked
      });
      document.getElementById('gpay-button-container').appendChild(button);
    }

    // 6. Payment Trigger Handler
    function onGooglePaymentButtonClicked() {
      const paymentDataRequest = Object.assign({}, baseRequest);
      paymentDataRequest.allowedPaymentMethods = allowedPaymentMethods;
      paymentDataRequest.transactionInfo = {
        totalPriceStatus: 'FINAL',
        totalPrice: '1.00',
        currencyCode: 'INR',
        countryCode: 'IN'
      };
      paymentDataRequest.merchantInfo = {
        merchantId: 'BCR2DN4T7WYKNJ2Q',
        merchantName: 'XTREAM BIRYANI DHABA AND RESTAURANT'
      };

      const paymentsClient = getGooglePaymentsClient();
      paymentsClient.loadPaymentData(paymentDataRequest)
        .then(function(paymentData) {
          // Success Response Handler
          console.log("Payment Data:", paymentData);
          showStatus("Payment Completed! Data: " + JSON.stringify(paymentData));
        })
        .catch(function(err) {
          console.error("Payment Sheet Error:", err);
          if (err.statusCode !== "CANCELED") {
            showStatus("Error: " + (err.statusMessage || err.statusCode));
          }
        });
    }

    function showStatus(text) {
      const box = document.getElementById('status-box');
      box.style.display = 'block';
      box.innerText = text;
    }
  </script>

</body>
</html>
