<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Instant Payment - Re 1</title>
  <!-- QRCode.js Library QR render karne ke liye -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .checkout-card {
      background: #ffffff;
      max-width: 400px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 24px;
      text-align: center;
    }
    .store-name {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .vpa-text {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .amount-box {
      background: #f8f9fa;
      border: 1px dashed #d0d7de;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .amount-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .amount-val {
      font-size: 28px;
      font-weight: 800;
      color: #0f9d58;
      margin-top: 2px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      padding: 10px;
      background: #fff;
    }
    #qrcode img {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #888;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e1e4e8;
    }
    .divider span {
      padding: 0 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
      text-decoration: none;
      color: white;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-upi { background-color: #1a73e8; }
    .btn-gpay { background-color: #1e8e3e; }
    .btn-phonepe { background-color: #5f259f; }
    .btn-paytm { background-color: #002970; }
    .note {
      font-size: 11px;
      color: #999;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <div class="store-name">XTREAM BIRYANI DHABA AND RESTAURANT</div>
    <div class="vpa-text">8305581123-1@okbizaxis</div>

    <div class="amount-box">
      <div class="amount-label">Amount Payable</div>
      <div class="amount-val">₹1.00</div>
    </div>

    <!-- QR Code Container (Sabse reliable method bina kisi warning ke) -->
    <div id="qrcode"></div>
    <div style="font-size: 12px; color: #555;">Scan QR using any UPI App</div>

    <div class="divider"><span>OR PAY DIRECTLY</span></div>

    <!-- Direct Intent Buttons -->
    <button class="btn btn-upi" onclick="triggerUPI('generic')">Pay via Any UPI App</button>
    <button class="btn btn-gpay" onclick="triggerUPI('gpay')">Google Pay (Direct)</button>
    <button class="btn btn-phonepe" onclick="triggerUPI('phonepe')">PhonePe (Direct)</button>
    <button class="btn btn-paytm" onclick="triggerUPI('paytm')">Paytm (Direct)</button>

    <div class="note">
      * Agar browser me "Transaction may be risky" dikhaye, toh upar diye gaye QR Code ko screenshot lekar ya dusre phone se scan karke pay karein.
    </div>
  </div>

  <script>
    // Config Data
    const paymentConfig = {
      pa: "8305581123-1@okbizaxis",
      pn: "XTREAM BIRYANI DHABA AND RESTAURANT",
      mc: "5812", // Restaurant / Eating Places Merchant Code
      mid: "BCR2DN4T7WYKNJ2Q", // Google Pay Merchant ID
      am: "1.00",
      cu: "INR",
      tn: "Payment of Re 1",
      tr: "TXN" + Math.floor(100000 + Math.random() * 900000) // Unique 6-digit transaction ref
    };

    // Standard Merchant URI banayein
    function buildUPIString() {
      const params = new URLSearchParams({
        pa: paymentConfig.pa,
        pn: paymentConfig.pn,
        mc: paymentConfig.mc,
        mid: paymentConfig.mid,
        am: paymentConfig.am,
        cu: paymentConfig.cu,
        tn: paymentConfig.tn,
        tr: paymentConfig.tr,
        mode: "02" // Merchant Transaction mode
      });
      return params.toString();
    }

    const upiQuery = buildUPIString();
    const upiUri = `upi://pay?${upiQuery}`;

    // 1. Page load hone par automatically QR Code generate karein
    new QRCode(document.getElementById("qrcode"), {
      text: upiUri,
      width: 170,
      height: 170,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });

    // 2. Apps trigger karne ka logic
    function triggerUPI(target) {
      let targetUrl = "";

      switch (target) {
        case "gpay":
          // Android Package Intent for Google Pay
          targetUrl = `intent://pay?${upiQuery}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`;
          break;
        case "phonepe":
          // Android Package Intent for PhonePe
          targetUrl = `intent://pay?${upiQuery}#Intent;scheme=upi;package=com.phonepe.app;end`;
          break;
        case "paytm":
          // Android Package Intent for Paytm
          targetUrl = `intent://pay?${upiQuery}#Intent;scheme=upi;package=net.one97.paytm;end`;
          break;
        default:
          // Default UPI Chooser (Standard Protocol)
          targetUrl = upiUri;
      }

      window.location.href = targetUrl;
    }
  </script>

</body>
</html>
